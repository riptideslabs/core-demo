# Plain HTTP in, plain HTTP out. No ssl_certificate, no proxy_ssl_*, nothing.
# riptides upgrades the hop to httpbin to mTLS underneath, in the kernel.
#
# The keepalive block is ordinary reverse-proxy tuning, not a riptides
# concession: it holds the upstream connection open between requests, which also
# means the mTLS session stays visible in /proc/riptides/connections.
upstream backend {
    server    127.0.0.1:8080;
    keepalive 4;
}

server {
    listen      8000;
    server_name _;

    location / {
        proxy_pass       http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

# The PAT itself. Substituted from $GITHUB_PAT at apply time and piped to
# `ctl apply -f -`, so the token never lands in a file on disk.
#
# Act 3's rotation step re-applies this same file with GITHUB_PAT overridden.
apiVersion: v1
kind: Secret
metadata:
  name: demo-github-pat
  namespace: riptides-system
type: Opaque
stringData:
  token: "${GITHUB_PAT}"

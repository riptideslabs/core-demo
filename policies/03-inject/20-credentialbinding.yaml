# Who gets the credential, and how it is delivered.
#
# propagation.injection = the kernel module adds `Authorization: Bearer <token>`
# to the workload's outbound HTTP requests. The alternative, propagation.sysfs,
# hands the workload a file to read instead — use that when the app wants to
# read its own secret. Here the app must stay unaware, so: injection.
#
# The selectors match the Service's labels (app: github-api), which is why
# 00-service-github.yaml has to exist.
#
# Apply this LAST. Its admission webhook checks two references, and rejects the
# binding if either is missing:
#   * the CredentialSource named below (11-credentialsource.yaml), and
#   * a WorkloadIdentity whose workloadID equals spec.workloadID
#     (12-wid-client.yaml) — the error reads
#     `WorkloadIdentity.core.riptides.io "demo/client/curl" not found`.
# Hence the file numbering: everything this depends on sorts before it.
apiVersion: core.riptides.io/v1alpha1
kind: CredentialBinding
metadata:
  name: demo-github-pat
  namespace: riptides-system
spec:
  workloadID: demo/client/curl
  credentialSource: demo-github-pat
  propagation:
    injection:
      selectors:
        - app: github-api

# Where the credential comes from: a static bearer token in a Secret.
#
# The other provider types on this oneof (aws, gcp, azure, oci, vault, oauth2,
# rfc7523, rfc8693, …) are what you would use for short-lived, brokered
# credentials — the shape below is the simplest one, and the one a PAT fits.
apiVersion: core.riptides.io/v1alpha1
kind: CredentialSource
metadata:
  name: demo-github-pat
  namespace: riptides-system
spec:
  kubernetes:
    type: BearerToken
    secretRef:
      name: demo-github-pat
      key: token

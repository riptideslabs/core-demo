# Revocation variant: redis-cli off the inbound allow-list, probe still on it.
# Applied on demand by the act to show authorization being enforced on a flow
# riptides never decrypted.
#
# Not picked up by apply_dir() — the -deny.yaml suffix excludes it.
apiVersion: core.riptides.io/v1alpha1
kind: WorkloadIdentity
metadata:
  name: demo-cache-redis
  namespace: riptides-system
spec:
  workloadID: demo/cache/redis
  scope:
    daemon:
      id: ${DAEMON_WORKLOAD_ID}
  selectors:
    - "process:name": redis-server
      "process:binary:path": /usr/local/bin/redis-server
  connection:
    tls:
      mode: MUTUAL
  allowedSPIFFEIDs:
    inbound:
      - spiffe://${TRUST_DOMAIN}/demo/cache/probe
